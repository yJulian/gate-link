[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3 --partition-table partitions.csv"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  # The ESP32-S3 linker script deliberately maps IRAM as one RWX segment.
  "-C", "link-arg=-Wl,--no-warn-rwx-segments",
]

[env]
ESP_LOG="info"

[build]
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]

[alias]
# Host-side unit tests of the hardware-independent crates (gate logic, MQTT
# commands/discovery/provisioning/flash records, the MQTT client). Overrides the
# xtensa default target, and - since `build-std` above can only be extended,
# not cleared, from the command line - also builds `std` for the host.
test-core = [
  "test", "-p", "gate-core", "-p", "app-core", "-p", "mqtt-async-embedded",
  "--target", "host-tuple",
  "--config", 'unstable.build-std=["std", "test", "panic_unwind"]',
]
