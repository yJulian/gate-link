[package]
edition      = "2024"
name         = "mqtt_gate"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "mqtt_gate"
path = "./src/bin/main.rs"

[package.metadata.espflash]
partition_table = "partitions.csv"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
heapless         = "0.9"

# Vendored + patched fork (adds CONNECT username/password support and a working
# PUBLISH encoder that the crates.io release lacks) — see vendor/mqtt-async-embedded/README.md.
mqtt-async-embedded = { path = "vendor/mqtt-async-embedded" }

# Flash-persisted config storage
esp-storage          = { version = "0.9.0", features = ["esp32"] }
embassy-embedded-hal = "0.6.0"
sequential-storage   = { version = "7.2.0", features = ["postcard"] }
postcard             = { version = "1", default-features = false }
serde                = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json           = { version = "1", default-features = false, features = ["alloc"] }

# Provisioning HTTP server + AP-mode DHCP server
picoserve        = { version = "0.18.0", features = ["alloc", "embassy"] }
edge-dhcp        = "0.8.0"
edge-nal         = "0.7"
edge-nal-embassy = "0.9.0"
embassy-sync     = "0.8.0"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
